name: Test Docstep
on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
jobs:
    unit_tests:
        runs-on: "${{ matrix.os }}"
        strategy:
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
                node: [20]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "${{ matrix.node }}"
                  cache: "npm"
            - run: npm install
            - run: npm run vscode:prepublish
            - run: npm run unit_test

    integration_tests:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: "npm"
            - run: npm install
            - run: npm run lint
            - run: npm run prepare_integration_tests
            # Stable, not insiders, so a red run means our change and not a nightly build.
            - run: xvfb-run -a npm run integration_test
              env:
                  VSCODE_VERSION: stable
